<!DOCTYPE html>
<html>
<head>
    <title>Edit Rolls</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .student-row { display: flex; gap: 10px; margin-bottom: 10px; background: #f4f4f4; padding: 10px; border-radius: 5px; }
        .student-row input { flex: 1; padding: 8px; border: 1px solid #ccc; }
        .roll-input { max-width: 60px; text-align: center; }
        .btn-del { background: #ff4444; color: white; border: none; padding: 5px 10px; border-radius: 4px; }
        .controls { position: sticky; bottom: 0; background: white; padding: 15px; border-top: 2px solid #ddd; display: flex; gap: 10px; }
    </style>
</head>
<body>
    <header>Editing: {{ filename }}</header>
    
    <div id="student-list" style="padding: 15px; padding-bottom: 80px;">
        {% for s in students %}
        <div class="student-row">
            <input type="number" class="roll-input" value="{{ s.roll }}" placeholder="Roll">
            <input type="text" class="name-input" value="{{ s.name }}" placeholder="Student Name">
            <button class="btn-del" onclick="this.parentElement.remove()">✕</button>
        </div>
        {% endfor %}
    </div>

    <div class="controls">
        <button onclick="addStudent()" style="background: #2196F3; color:white;">➕ Add Student</button>
        <button onclick="saveAll()" style="background: #4CAF50; color:white; flex-grow: 1;">💾 Save Changes</button>
        <button onclick="history.back()" style="background: #666; color:white;">Back</button>
    </div>

    <script>
        function addStudent() {
            const div = document.createElement('div');
            div.className = 'student-row';
            div.innerHTML = `
                <input type="number" class="roll-input" placeholder="Roll">
                <input type="text" class="name-input" placeholder="Student Name">
                <button class="btn-del" onclick="this.parentElement.remove()">✕</button>
            `;
            document.getElementById('student-list').appendChild(div);
        }

        function saveAll() {
            const rows = document.querySelectorAll('.student-row');
            const students = Array.from(rows).map(row => ({
                roll: row.querySelector('.roll-input').value,
                name: row.querySelector('.name-input').value
            })).filter(s => s.roll && s.name);

            fetch('/save_rolls', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ filename: "{{ filename }}", students: students })
            }).then(r => r.json()).then(data => {
                if(data.status === 'success') alert('Saved successfully!');
                else alert('Error saving: ' + data.message);
            });
        }
    </script>
</body>
</html>
