<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>File Browser</title>
<link rel="stylesheet" href="/static/style.css">
<style>
  body { background: #f0f2f5; color: #111; margin: 0; padding: 0; font-family: sans-serif; }
  header { background: #111; color: #fff; padding: 15px; position: sticky; top: 0; z-index: 100; text-align: center; }

  .search-bar {
    padding: 10px;
    display: flex;
    gap: 8px;
    background: #fff;
    border-bottom: 1px solid #ddd;
  }
  .search-bar input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
  .search-bar button { padding: 10px 15px; background: #2563eb; color: white; border: none; border-radius: 5px; }

  .file-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
    padding: 15px 0;
  }

  .image-card {
    background: #fff;
    width: 95%; /* Almost full width */
    border-radius: 10px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    overflow: hidden;
  }

  /* CONTAINER FOR ALL IMAGES */
  .img-wrapper {
    width: 100%;
    background: #fff;
    display: flex;
    justify-content: center;
    overflow: hidden;
  }

  /* FIX FOR OUTPUT (NORMAL) */
  .img-wrapper img {
    width: 100%;
    height: auto;
    display: block;
  }

  /* THE "INPUT" FOLDER ROTATION FIX */
  .rotate-box {
    /* Force a vertical aspect ratio container */
    height: 120vw; /* Height is 120% of the screen width */
    position: relative;
  }

  .rotate-box img {
    /* Swap width and height logic for rotation */
    width: 120vw !important; /* This becomes the 'height' after rotation */
    height: 95vw !important; /* This becomes the 'width' after rotation */
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) rotate(-90deg);
    object-fit: contain;
  }

  .file-actions {
    padding: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #fafafa;
    border-top: 1px solid #eee;
  }

  .fname { font-size: 13px; font-weight: bold; color: #555; }

  #preview {
    position: fixed; top:0; left:0; width:100%; height:100%;
    background: rgba(0,0,0,0.9); z-index: 9999;
    display: none; justify-content: center; align-items: center;
  }
  #preview img { max-width: 98%; max-height: 98%; }
</style>
</head>
<body>

<header onclick="location.href='/'">⬅ {{ path }}</header>

{% if path == "output" or path == "class" in path %}
<div class="search-bar">
  <input id="rollSearch" placeholder="Search Roll Number...">
  <button onclick="searchRoll()">Search</button>
</div>
{% endif %}

<div class="file-container" id="fileBox">
{% for item in items %}
  {% if not item.is_dir %}
  <div class="image-card" data-name="{{ item.name }}">
    
    <div class="img-wrapper {% if path == 'input' %}rotate-box{% endif %}">
      <img src="/file?path={{ path }}/{{ item.name }}" onclick="openPreview(this.src)" loading="lazy">
    </div>

    <div class="file-actions">
      <span class="fname">{{ item.name }}</span>
      <div>
        <button class="mini" onclick="renameFile('{{ path }}/{{ item.name }}')">✏️</button>
        <button class="mini danger" onclick="deleteFile('{{ path }}/{{ item.name }}')">🗑️</button>
      </div>
    </div>
  </div>
  {% endif %}
{% endfor %}
</div>

<div id="preview" onclick="this.style.display='none'">
  <img id="previewImg">
</div>

<script>
function openPreview(src){
    document.getElementById('previewImg').src = src;
    document.getElementById('preview').style.display = 'flex';
}

function searchRoll(){
  let val = document.getElementById("rollSearch").value.toLowerCase();
  document.querySelectorAll(".image-card").forEach(card => {
    let name = card.getAttribute("data-name").toLowerCase();
    card.style.display = name.includes(val) ? "flex" : "none";
  });
}

function deleteFile(p){
    if(confirm("Delete?")) fetch("/delete",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({path:p})}).then(()=>location.reload());
}

function renameFile(oldPath){
    let n = prompt("New name", oldPath.split('/').pop().replace('.jpg',''));
    if(!n) return;
    let folder = oldPath.split('/').slice(0,-1).join('/');
    fetch("/rename",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({old:oldPath,new:folder+"/"+n+".jpg"})}).then(()=>location.reload());
}
</script>
</body>
</html>
