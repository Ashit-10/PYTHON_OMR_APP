<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header onclick="history.back()">⬅ {{ path }}</header>

<div class="file-container">

{% for i in items %}
  {% if i.is_dir %}
    <div class="folder-row">
      📁 {{ i.name }}
      {% if i.name.startswith("class") %}
        <button class="mini danger" onclick="askDelete('{{path}}/{{i.name}}')">🗑</button>
      {% endif %}
    </div>
  {% else %}
    <div class="image-card">
      <img src="/file?path={{path}}/{{i.name}}" onclick="viewImage(this.src)">
      <div class="file-actions">
        <span class="fname">{{ i.name }}</span>
        <button class="mini" onclick="renameFile('{{path}}/{{i.name}}')">✏</button>
        <button class="mini danger" onclick="askDelete('{{path}}/{{i.name}}')">🗑</button>
      </div>
    </div>
  {% endif %}
{% endfor %}

</div>

<!-- DELETE CONFIRM MODAL -->
<div id="deleteModal" class="modal">
  <div class="modal-box">
    <p>Are you sure you want to delete?</p>
    <button onclick="doDelete()">Yes</button>
    <button class="danger" onclick="closeDelete()">Cancel</button>
  </div>
</div>

<!-- IMAGE PREVIEW -->
<div id="preview" onclick="this.style.display='none'">
  <img id="previewImg">
</div>

<script>
let deletePath=""

function askDelete(p){
  deletePath=p
  deleteModal.style.display="flex"
}
function closeDelete(){
  deleteModal.style.display="none"
}
function doDelete(){
  fetch("/delete",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({ path: deletePath })
  }).then(()=>location.reload())
}

function renameFile(oldPath){
  let base=oldPath.split('/').pop().replace('.jpg','')
  let folder=oldPath.split('/').slice(0,-1).join('/')
  let n=prompt("New name:",base)
  if(!n) return
  fetch("/rename",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({
      old: oldPath,
      new: folder+"/"+n+".jpg"
    })
  }).then(()=>location.reload())
}

function viewImage(src){
  previewImg.src=src
  preview.style.display="flex"
}
</script>

</body>
</html>
