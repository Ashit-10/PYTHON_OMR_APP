<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header onclick="history.back()">⬅ {{ path }}</header>

{% if path == "output" %}
<div class="search-bar">
  <input id="rollSearch" placeholder="Enter roll number">
  <button onclick="searchRoll()">Search</button>
</div>
{% endif %}

<div class="file-container" id="fileBox">

{% for i in items %}
  {% if not i.is_dir %}
    <div class="image-card" data-name="{{ i.name }}">
      <img src="/file?path={{path}}/{{i.name}}" onclick="viewImage(this.src)">
      <div class="file-actions">
        <span class="fname">{{ i.name }}</span>
        <button class="mini" onclick="renameFile('{{path}}/{{i.name}}')">✏</button>
        <button class="mini danger" onclick="deleteFile('{{path}}/{{i.name}}')">🗑</button>
      </div>
    </div>
  {% endif %}
{% endfor %}

</div>

<div id="preview" onclick="this.style.display='none'">
  <img id="previewImg">
</div>

<script>
function deleteFile(p){
  if(confirm("Delete this file?")){
    fetch("/delete",{
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body:JSON.stringify({ path:p })
    }).then(()=>location.reload())
  }
}

function renameFile(oldPath){
  let base = oldPath.split('/').pop().replace('.jpg','')
  let folder = oldPath.split('/').slice(0,-1).join('/')
  let n = prompt("New name", base)
  if(!n) return
  fetch("/rename",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({
      old: oldPath,
      new: folder+"/"+n+".jpg"
    })
  }).then(()=>location.reload())
}

function viewImage(src){
  previewImg.src=src
  preview.style.display="flex"
}

function searchRoll(){
  let r = rollSearch.value.trim()
  document.querySelectorAll(".image-card").forEach(c=>{
    c.style.display = c.dataset.name.startsWith(r+"_") ? "block" : "none"
  })
}
</script>

</body>
</html>
