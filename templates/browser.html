<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>File Browser</title>
<link rel="stylesheet" href="/static/style.css">
<style>
  .file-container {
    display: flex;
    flex-direction: column;
    gap: 15px;
    padding: 10px;
    background: #f0f0f0;
  }

  .image-card {
    background: #fff;
    border-radius: 12px;
    padding: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    overflow: hidden; /* Critical to hide overflow from rotation */
  }

  /* CONTAINER FOR THE IMAGE */
  .img-wrapper {
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #eee;
    border-radius: 8px;
    overflow: hidden;
  }

  /* NORMAL IMAGES */
  .img-wrapper img {
    width: 100%;
    height: auto;
    display: block;
  }

  /* ROTATED IMAGES FIX (The "Input" Folder) */
  /* We use a container with a set aspect ratio to "force" the height down */
  .rotate-container {
    aspect-ratio: 4 / 3; /* Typical OMR sheet ratio when turned sideways */
    position: relative;
    width: 100%;
    height: auto;
  }

  .rotate-container img {
    position: absolute;
    width: 133.33%; /* (4/3) * 100 to compensate for the turn */
    height: 75%;    /* (3/4) * 100 to compensate for the turn */
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) rotate(-90deg);
    object-fit: contain;
  }

  .file-actions {
    margin-top: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .fname { font-size: 13px; font-weight: 600; color: #444; }

  #preview {
    position: fixed; top:0; left:0; width:100%; height:100%;
    background: rgba(0,0,0,0.9); z-index: 9999;
    display: none; justify-content: center; align-items: center;
  }
</style>
</head>
<body>

<header onclick="location.href='/'">⬅ {{ path }}</header>

<div class="file-container">
{% for item in items %}
  {% if not item.is_dir %}
  <div class="image-card" data-name="{{ item.name }}">
    
    <div class="img-wrapper {% if path == 'input' %}rotate-container{% endif %}">
      <img src="/file?path={{ path }}/{{ item.name }}" onclick="openPreview(this.src)" loading="lazy">
    </div>

    <div class="file-actions">
      <span class="fname">{{ item.name }}</span>
      <div>
        <button class="mini" onclick="renameFile('{{ path }}/{{ item.name }}')">✏️</button>
        <button class="mini danger" onclick="deleteFile('{{ path }}/{{ item.name }}')">🗑️</button>
      </div>
    </div>
  </div>
  {% endif %}
{% endfor %}
</div>

<div id="preview" onclick="this.style.display='none'">
  <img id="previewImg" style="max-width:100%; max-height:100%;">
</div>

<script>
function openPreview(src){
    document.getElementById('previewImg').src = src;
    document.getElementById('preview').style.display = 'flex';
}

function deleteFile(p){
    if(confirm("Delete?")) fetch("/delete",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({path:p})}).then(()=>location.reload());
}

function renameFile(oldPath){
    let n = prompt("New name", oldPath.split('/').pop().replace('.jpg',''));
    if(!n) return;
    let folder = oldPath.split('/').slice(0,-1).join('/');
    fetch("/rename",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({old:oldPath,new:folder+"/"+n+".jpg"})}).then(()=>location.reload());
}
</script>
</body>
</html>
