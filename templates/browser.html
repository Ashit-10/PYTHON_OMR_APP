<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>File Browser</title>
<link rel="stylesheet" href="/static/style.css">
<style>
  body { background: #1a1a1a; color: white; margin: 0; padding: 0; }
  header { background: #000; padding: 15px; position: sticky; top: 0; z-index: 100; }

  .file-container {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 10px;
  }

  .image-card {
    background: #2a2a2a;
    border-radius: 8px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* CONTAINER THAT CLIPS THE BLANK SPACES */
  .img-wrapper {
    width: 100%;
    position: relative;
    background: #000;
    overflow: hidden; /* This hides the 'ghost' white space */
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* FOR OUTPUT FOLDER (NORMAL) */
  .img-wrapper img {
    width: 100%;
    height: auto;
    display: block;
  }

  /* FOR INPUT FOLDER (ROTATED) */
  .rotate-fix {
    /* This forces the container to a vertical shape before rotation */
    aspect-ratio: 3 / 4; 
  }

  .rotate-fix img {
    /* We make the image huge so when it rotates, it fills the width */
    width: 140% !important; 
    height: auto !important;
    transform: rotate(-90deg);
    object-fit: contain;
  }

  .file-actions {
    padding: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #333;
  }

  .fname { font-size: 14px; color: #eee; font-family: monospace; }

  /* Fullscreen Preview */
  #preview {
    position: fixed; top:0; left:0; width:100%; height:100%;
    background: #000; z-index: 9999;
    display: none; justify-content: center; align-items: center;
  }
</style>
</head>
<body>

<header onclick="location.href='/'">⬅ {{ path }}</header>

<div class="file-container">
{% for item in items %}
  {% if not item.is_dir %}
  <div class="image-card" data-name="{{ item.name }}">
    
    <div class="img-wrapper {% if path == 'input' %}rotate-fix{% endif %}">
      <img src="/file?path={{ path }}/{{ item.name }}" onclick="openPreview(this.src)" loading="lazy">
    </div>

    <div class="file-actions">
      <span class="fname">{{ item.name }}</span>
      <div>
        <button class="mini" onclick="renameFile('{{ path }}/{{ item.name }}')">✏️</button>
        <button class="mini danger" onclick="deleteFile('{{ path }}/{{ item.name }}')">🗑️</button>
      </div>
    </div>
  </div>
  {% endif %}
{% endfor %}
</div>

<div id="preview" onclick="this.style.display='none'">
  <img id="previewImg" style="max-width:100%; max-height:100%;">
</div>

<script>
function openPreview(src){
    document.getElementById('previewImg').src = src;
    document.getElementById('preview').style.display = 'flex';
}
function deleteFile(p){
    if(confirm("Delete?")) fetch("/delete",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({path:p})}).then(()=>location.reload());
}
function renameFile(oldPath){
    let n = prompt("New name", oldPath.split('/').pop().replace('.jpg',''));
    if(!n) return;
    let folder = oldPath.split('/').slice(0,-1).join('/');
    fetch("/rename",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({old:oldPath,new:folder+"/"+n+".jpg"})}).then(()=>location.reload());
}
</script>
</body>
</html>
