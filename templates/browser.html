<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>File Browser</title>
<link rel="stylesheet" href="/static/style.css">
<style>
  body { background: #fff; color: #111; margin: 0; padding: 0; font-family: sans-serif; }
  header { background: #111; color: #fff; padding: 15px; position: sticky; top: 0; z-index: 100; text-align: center; cursor: pointer; }

  .search-bar { padding: 10px; display: flex; gap: 8px; background: #fff; border-bottom: 1px solid #ddd; }
  .search-bar input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; }
  .search-bar button { padding: 10px 15px; background: #2563eb; color: white; border: none; border-radius: 5px; }

  .file-container { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 10px 0; }

  .image-card {
    background: #fff;
    width: 98%; 
    border-radius: 4px;
    border: 1px solid #ddd;
    overflow: hidden;
    margin-bottom: 5px;
  }

  .img-wrapper {
    width: 100%;
    background: #fff;
    overflow: hidden;
    position: relative;
    display: flex;
    justify-content: center;
  }

  .img-wrapper img {
    width: 100%;
    height: auto;
    display: block;
    object-fit: cover;
  }

  /* INPUT FOLDER SPECIFIC ROTATION */
  .rotate-box {
  width: 120%;
  height: 25vh;      /* This controls how "tall" the strip looks on your screen */
  position: relative;
  background: #fff;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* 2. This forces the image to be huge so it fills the screen after rotation */
.rotate-box img {
  /* We make the image's height match your screen width (100vw) */
  height: 140% !important; 
  width: auto !important;
  
  /* We scale it up (zoom) to remove the centering 'smallness' */
  /* If it's still too small, increase 1.5 to 1.8 */
  transform: translate(-50%, -50%) rotate(-90deg) scale(1.5);
  
  position: absolute;
  top: 50%;
  left: 50%;
  object-fit: contain;
  max-width: none !important; /* Prevents the browser from forced shrinking */
  max-height: none !important; 
}

  .file-actions {
    padding: 8px 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #f1f1f1;
  }

  .fname { font-size: 12px; font-weight: bold; color: #333; }
  #noMatch { display: none; padding: 20px; text-align: center; color: red; font-weight: bold; }

  /* Delete All Section */
  .batch-actions {
    padding: 20px;
    text-align: center;
    margin-bottom: 40px;
  }
  .btn-delete-all {
    width: 95%;
    padding: 15px;
    background-color: #ef4444;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
  }
  .btn-delete-all:active { background-color: #b91c1c; }
</style>
</head>
<body>

<header onclick="location.href='/'">⬅ {{ path }}</header>

{% if path == "output" or "class" in path %}
<div class="search-bar">
  <input id="rollSearch" placeholder="Search Roll Number..." oninput="searchRoll()">
  <button onclick="searchRoll()">🔍</button>
</div>
{% endif %}

<div id="noMatch">❌ Roll Number Not Found</div>

<div class="file-container" id="fileBox">
{% for item in items %}
  {% if not item.is_dir %}
  <div class="image-card" data-name="{{ item.name }}">
    <div class="img-wrapper {% if path == 'input' %}rotate-box{% endif %}">
      <img src="/file?path={{ path }}/{{ item.name }}" onclick="openPreview(this.src)" loading="lazy">
    </div>
    <div class="file-actions">
      <span class="fname">{{ item.name }}</span>
      <div>
        <button class="mini" onclick="renameFile('{{ path }}/{{ item.name }}')">✏️</button>
        <button class="mini danger" onclick="deleteFile('{{ path }}/{{ item.name }}')">🗑️</button>
      </div>
    </div>
  </div>
  {% endif %}
{% endfor %}
</div>

{% if items %}
<div class="batch-actions">
    <button class="btn-delete-all" onclick="deleteAllFiles()">
        🗑️ DELETE ALL IN THIS FOLDER
    </button>
</div>
{% endif %}

<div id="preview" onclick="this.style.display='none'" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:1000; justify-content:center; align-items:center;">
  <img id="previewImg" style="max-width:98%; max-height:98%;">
</div>

<script>
function searchRoll(){
  let val = document.getElementById("rollSearch").value.toLowerCase();
  let cards = document.querySelectorAll(".image-card");
  let found = 0;
  cards.forEach(card => {
    let name = card.getAttribute("data-name").toLowerCase();
    if(name.includes(val)){
      card.style.display = "block";
      found++;
    } else {
      card.style.display = "none";
    }
  });
  document.getElementById("noMatch").style.display = (found === 0 && val !== "") ? "block" : "none";
}

function openPreview(src){
    document.getElementById('previewImg').src = src;
    document.getElementById('preview').style.display = 'flex';
}

function deleteFile(p){
    if(confirm("Delete this file?")) {
        fetch("/delete", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ path: p })
        }).then(() => location.reload());
    }
}

async function deleteAllFiles() {
    // Confirmation Dialog
    const confirmed = confirm("⚠️ WARNING: This will delete EVERY file in this folder. This cannot be undone. Proceed?");
    
    if (confirmed) {
        const cards = document.querySelectorAll(".image-card");
        const folderPath = "{{ path }}";
        
        // Disable button to prevent double clicks
        const btn = document.querySelector(".btn-delete-all");
        btn.innerText = "Deleting... Please wait";
        btn.disabled = true;

        let deletePromises = [];

        cards.forEach(card => {
            const fileName = card.getAttribute("data-name");
            const fullPath = folderPath + "/" + fileName;
            
            // Push each delete fetch into an array
            const p = fetch("/delete", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ path: fullPath })
            });
            deletePromises.push(p);
        });

        if (deletePromises.length === 0) {
            alert("No files found to delete.");
            return;
        }

        try {
            // Wait for all deletions to finish
            await Promise.all(deletePromises);
            alert("Folder cleared successfully.");
            location.reload();
        } catch (err) {
            console.error(err);
            alert("Some files might not have been deleted. Refreshing...");
            location.reload();
        }
    }
}

function renameFile(oldPath) {
    const currentPath = "{{ path }}";
    const isOutput = currentPath.includes("output") || currentPath.includes("class");
    
    let filename = oldPath.split('/').pop();
    let parts = filename.split('.');
    let ext = parts.length > 1 ? '.' + parts.pop() : '';
    let baseName = parts.join('.');

    let newName = "";

    if (isOutput) {
        let nameParts = baseName.split('_');
        let oldRoll = nameParts[0] || "";
        let oldMarks = nameParts[1] || "";

        let newRoll = prompt("Enter Roll Number:", oldRoll);
        if (newRoll === null) return; 

        let strippedRoll = parseInt(newRoll, 10).toString();
        if (isNaN(strippedRoll)) strippedRoll = "0"; 

        let newMarks = prompt("Enter Marks:", oldMarks);
        if (newMarks === null) return;

        // This removes the _1 by only using Roll and Marks
        newName = strippedRoll + "_" + newMarks;
    } else {
        let n = prompt("New name", baseName);
        if (!n || n === baseName) return;
        newName = n;
    }

    let folder = oldPath.substring(0, oldPath.lastIndexOf('/'));
    let newPath = folder + "/" + newName + ext;

    // PREVENT SELF-RENAME: If name hasn't changed, just exit
    if (newPath === oldPath) return;

    fetch("/rename", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ old: oldPath, new: newPath })
    }).then(async res => {
        if (res.status === 409) {
            alert("Error: A file with the name '" + newName + ext + "' already exists in this folder.");
        } else if (!res.ok) {
            alert("Rename failed. The server encountered an error.");
        } else {
            location.reload(); // Only reload if successful
        }
    });
}



</script>
</body>
</html>
