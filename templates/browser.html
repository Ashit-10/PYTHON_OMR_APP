<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header onclick="history.back()">⬅ {{ path or "root" }}</header>

<div class="file-container">

{% for i in items %}
  {% if i.is_dir %}
    <div class="folder-row" onclick="openFolder('{{ i.name }}')">
      📁 {{ i.name }}
    </div>
  {% else %}
    <div class="image-card">
      <img src="/file?path={{ path }}/{{ i.name }}" onclick="viewImage(this.src)">

      <div class="file-actions">
        <span class="fname">{{ i.name }}</span>

        <button class="mini" onclick="renameFile('{{ path }}/{{ i.name }}')">✏</button>
        <button class="mini danger" onclick="confirmDelete('{{ path }}/{{ i.name }}', this)">🗑</button>
      </div>
    </div>
  {% endif %}
{% endfor %}

</div>

<!-- Fullscreen preview -->
<div id="preview" onclick="this.style.display='none'">
  <img id="previewImg">
</div>

<script>
function openFolder(name){
  location.href = "/browse?path={{ path }}/" + name
}

function renameFile(oldPath){
  let base = oldPath.split('/').pop().replace('.jpg','')
  let folder = oldPath.split('/').slice(0,-1).join('/')

  let newName = prompt("New file name (without .jpg):", base)
  if(!newName) return

  fetch("/rename",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({
      old: oldPath,
      new: folder + "/" + newName + ".jpg"
    })
  }).then(()=>location.reload())
}

function confirmDelete(path, btn){
  btn.innerText = "✔"
  btn.onclick = () => deleteFile(path)
}

function deleteFile(path){
  fetch("/delete",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({ path })
  }).then(()=>location.reload())
}

function viewImage(src){
  document.getElementById("previewImg").src = src
  document.getElementById("preview").style.display = "flex"
}
</script>

</body>
</html>
