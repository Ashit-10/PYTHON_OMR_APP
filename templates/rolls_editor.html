<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ filename }}</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        body { background: #121212; color: #e0e0e0; font-family: sans-serif; margin: 0; }
        header { padding: 15px; background: #222; display: flex; align-items: center; gap: 20px; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #333; }
        .student-item {
            display: flex; align-items: center; gap: 15px;
            background: #1e1e1e; padding: 12px;
            margin: 8px; border-radius: 10px;
            border: 1px solid #333;
        }
        .roll-number {
            font-family: monospace; font-size: 1.1rem;
            color: #00ffaa; min-width: 40px; font-weight: bold;
        }
        input.name-input {
            flex-grow: 1; background: transparent; border: none;
            color: white; font-size: 1rem; border-bottom: 1px solid #444;
            padding: 5px;
        }
        input.name-input:focus { border-bottom: 1px solid #00ffaa; outline: none; }
        .delete-btn { background: none; border: none; color: #ff5555; cursor: pointer; font-size: 1.2rem; }
        
        .footer-actions {
            position: fixed; bottom: 0; width: 100%; 
            background: #1a1a1a; padding: 15px; 
            display: flex; gap: 8px; box-sizing: border-box;
            border-top: 1px solid #333;
        }
        .footer-actions button {
            border: none; border-radius: 8px; padding: 12px;
            color: white; font-weight: bold; cursor: pointer;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <header>
        <button type="button" onclick="window.location.href='/'" style="background:none; border:none; color:white; font-size: 1.5rem; cursor: pointer;">←</button>
        <h3 style="margin:0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{ filename }}</h3>
    </header>

    <div id="list-container" style="padding-bottom: 100px;">
        {% for s in students %}
        <div class="student-item">
            <span class="roll-number">{{ s.roll }}</span>
            <input type="text" class="name-input" value="{{ s.name }}">
            <button type="button" class="delete-btn" onclick="this.parentElement.remove();">🗑</button>
        </div>
        {% endfor %}
    </div>

    <div class="footer-actions">
        <button type="button" onclick="addNewStudent()" style="flex: 1; background: #333;">➕ Add</button>
        <button type="button" onclick="saveChanges()" style="flex: 1.5; background: #00897b;">💾 Save Changes</button>
        <button type="button" id="gitBtn" onclick="syncToGithub()" style="flex: 1; background: #24292e;">🐙 GitHub</button>
    </div>

<script>
function addNewStudent() {
    const items = document.querySelectorAll('.student-item');
    let maxRoll = 0;
    let existingRolls = [];

    items.forEach(item => {
        let val = parseInt(item.querySelector('.roll-number').innerText);
        existingRolls.push(val);
        if (!isNaN(val) && val > maxRoll) maxRoll = val;
    });

    const nextRollDefault = maxRoll + 1;
    let customRollStr = prompt("Roll Number:", nextRollDefault);
    if (customRollStr === null || customRollStr.trim() === "") return;
    
    let customRoll = parseInt(customRollStr);

    if (existingRolls.includes(customRoll)) {
        alert("Roll " + customRoll + " already exists!");
        return;
    }

    const name = prompt("Enter Student Name:");
    if (name === null || name.trim() === "") return;

    const container = document.getElementById('list-container');
    const div = document.createElement('div');
    div.className = 'student-item';
    div.innerHTML = `
        <span class="roll-number">${customRoll}</span>
        <input type="text" class="name-input" value="${name}">
        <button type="button" class="delete-btn" onclick="this.parentElement.remove(); saveChanges(true);">🗑</button>
    `;
    
    container.appendChild(div);
    sortList(); 
    div.scrollIntoView({ behavior: 'smooth' });

    // Auto-save when adding, but silently
    saveChanges(true);
}

function sortList() {
    const container = document.getElementById('list-container');
    const items = Array.from(container.getElementsByClassName('student-item'));
    items.sort((a, b) => parseInt(a.querySelector('.roll-number').innerText) - parseInt(b.querySelector('.roll-number').innerText));
    items.forEach(item => container.appendChild(item));
}

function saveChanges(silent = false) {
    const items = document.querySelectorAll('.student-item');
    const students = Array.from(items).map(item => ({
        roll: item.querySelector('.roll-number').innerText,
        name: item.querySelector('.name-input').value
    }));

    fetch('/save_rolls', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ filename: "{{ filename }}", students: students })
    })
    .then(r => r.json())
    .then(data => {
        if (data.status === 'success') {
            if (!silent) alert("✅ Changes saved to local file!");
        } else {
            alert("❌ Save Error: " + data.message);
        }
    });
}

function syncToGithub() {
    const btn = document.getElementById('gitBtn');
    if(!confirm("Push local file to GitHub?")) return;
    
    btn.innerText = "⏳ Pushing...";
    btn.disabled = true;

    fetch(`/sync_roll_github?file={{ filename }}`)
    .then(r => r.json())
    .then(data => {
        if(data.status === 'success') alert("🚀 Uploaded to GitHub successfully!");
        else alert("❌ GitHub Error: " + JSON.stringify(data.message));
    })
    .finally(() => {
        btn.innerText = "🐙 GitHub";
        btn.disabled = false;
    });
}
</script>
</body>
</html>
