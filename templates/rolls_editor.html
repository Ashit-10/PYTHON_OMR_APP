<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ filename }}</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        body { background: #121212; color: #e0e0e0; font-family: sans-serif; }
        .student-item {
            display: flex; align-items: center; gap: 15px;
            background: #1e1e1e; padding: 12px;
            margin: 8px; border-radius: 10px;
            border: 1px solid #333;
        }
        .roll-number {
            font-family: monospace; font-size: 1.1rem;
            color: #00ffaa; min-width: 30px; font-weight: bold;
        }
        input.name-input {
            flex-grow: 1; background: transparent; border: none;
            color: white; font-size: 1rem; border-bottom: 1px solid #444;
            padding: 5px;
        }
        input.name-input:focus { border-bottom: 1px solid #00ffaa; outline: none; }
        .delete-btn { background: none; border: none; color: #ff5555; cursor: pointer; font-size: 1.2rem; }
    </style>
</head>
<body>
    <header style="padding: 15px; background: #222; display: flex; align-items: center; gap: 20px;">
        <button onclick="window.location.href='/'" style="background:none; border:none; color:white; font-size: 1.5rem;">←</button>
        <h3 style="margin:0;">{{ filename }}</h3>
    </header>

    <div id="list-container" style="padding-bottom: 100px;">
        {% for s in students %}
        <div class="student-item">
            <span class="roll-number">{{ s.roll }}</span>
            <input type="text" class="name-input" value="{{ s.name }}">
            <button class="delete-btn" onclick="this.parentElement.remove()">🗑</button>
        </div>
        {% endfor %}
    </div>

    <div style="position: fixed; bottom: 0; width: 100%; background: #1a1a1a; padding: 20px; display: flex; gap: 10px; box-sizing: border-box;">
        <button onclick="addNewStudent()" style="flex: 1; padding: 12px; border-radius: 8px; border: none; background: #333; color: white;">➕ Add Student</button>
        <button onclick="saveChanges()" style="flex: 2; padding: 12px; border-radius: 8px; border: none; background: #00897b; color: white; font-weight: bold;">💾 Save to File</button>
    </div>

    <script>
        function addNewStudent() {
            const name = prompt("Enter Student Name:");
            if (!name) return;

            const container = document.getElementById('list-container');
            const rolls = document.querySelectorAll('.roll-number');
            
            // Calculate next roll number
            let maxRoll = 0;
            rolls.forEach(el => {
                let val = parseInt(el.innerText);
                if (val > maxRoll) maxRoll = val;
            });
            const nextRoll = maxRoll + 1;

            const div = document.createElement('div');
            div.className = 'student-item';
            div.innerHTML = `
                <span class="roll-number">${nextRoll}</span>
                <input type="text" class="name-input" value="${name}">
                <button class="delete-btn" onclick="this.parentElement.remove()">🗑</button>
            `;
            container.appendChild(div);
            window.scrollTo(0, document.body.scrollHeight);
        }

        function saveChanges() {
            const items = document.querySelectorAll('.student-item');
            const students = Array.from(items).map(item => ({
                roll: item.querySelector('.roll-number').innerText,
                name: item.querySelector('.name-input').value
            }));

            fetch('/save_rolls', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    filename: "{{ filename }}",
                    students: students
                })
            })
            .then(r => r.json())
            .then(data => {
                if (data.status === 'success') alert("Saved successfully!");
                else alert("Error: " + data.message);
            });
        }
    </script>
</body>
</html>
