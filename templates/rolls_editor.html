<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Managing {{ filename }}</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .student-item {
            display: flex; align-items: center; gap: 10px;
            background: #2c2c2c; color: white; padding: 12px;
            margin-bottom: 8px; border-radius: 8px;
        }
        .roll-box { font-weight: bold; color: #00ff00; width: 40px; }
        input.name-edit {
            flex-grow: 1; border: 1px solid #444; background: #1e1e1e;
            color: white; padding: 8px; border-radius: 4px;
        }
        .delete-btn { background: #441111; color: #ff5555; border: 1px solid #662222; padding: 8px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <header style="background: #333; padding: 15px; text-align: center; color: white;">
        <button onclick="window.location.href='/'" style="float: left; background: none; color: white; border: none; font-size: 1.2rem; cursor: pointer;">←</button>
        {{ filename }}
    </header>

    <div id="student-container" style="padding: 15px; margin-bottom: 100px;">
        {% for s in students %}
        <div class="student-item">
            <span class="roll-box">{{ s.roll }}</span>
            <input type="text" class="name-edit" value="{{ s.name }}" data-roll="{{ s.roll }}">
            <button class="delete-btn" onclick="this.parentElement.remove()">🗑</button>
        </div>
        {% endfor %}
    </div>

    <div style="position: fixed; bottom: 0; width: 100%; background: #111; padding: 15px; display: flex; gap: 10px; box-sizing: border-box; border-top: 2px solid #333;">
        <button onclick="addNewStudent()" style="flex: 1; background: #5d4037; color: white; padding: 12px; border: none; border-radius: 5px;">➕ Add Student</button>
        <button onclick="saveData()" style="flex: 2; background: #2e7d32; color: white; padding: 12px; border: none; border-radius: 5px; font-weight: bold;">💾 Save Changes</button>
    </div>

    <script>
        function addNewStudent() {
            const container = document.getElementById('student-container');
            
            // 1. Ask for the Name via Popup
            const studentName = prompt("Enter Student Name:");
            if (!studentName || studentName.trim() === "") return;

            // 2. Automatically find the next Roll Number
            const items = document.querySelectorAll('.roll-box');
            let maxRoll = 0;
            items.forEach(item => {
                const val = parseInt(item.innerText);
                if (val > maxRoll) maxRoll = val;
            });
            const nextRoll = maxRoll + 1;

            // 3. Add to UI
            const div = document.createElement('div');
            div.className = 'student-item';
            div.innerHTML = `
                <span class="roll-box">${nextRoll}</span>
                <input type="text" class="name-edit" value="${studentName}" data-roll="${nextRoll}">
                <button class="delete-btn" onclick="this.parentElement.remove()">🗑</button>
            `;
            container.appendChild(div);
        }

        function saveData() {
            const items = document.querySelectorAll('.student-item');
            
            // Map the rows back into a list of objects
            const students = Array.from(items).map(item => ({
                roll: item.querySelector('.roll-box').innerText,
                name: item.querySelector('.name-edit').value
            }));

            fetch('/save_rolls', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    filename: "{{ filename }}", 
                    students: students 
                })
            })
            .then(r => r.json())
            .then(data => {
                if(data.status === 'success') {
                    alert('Successfully saved to {{ filename }}');
                } else {
                    alert('Error: ' + data.message);
                }
            });
        }
    </script>
</body>
</html>
