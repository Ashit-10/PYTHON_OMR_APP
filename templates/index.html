<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header>OMR Scanner</header>

<div class="banner">
  <input id="cls" placeholder="Class">
  <input id="sub" placeholder="Subject">
  <button onclick="createFolder()">Create Folder</button>
</div>

<section>
  <button onclick="openAnswerKey()">🗝 Answer Key</button>
</section>

<section class="card">
<h3>Project Folders</h3>
<ul id="folders">
{% for f in folders %}
<li onclick="openFolder('{{f}}')">📁 {{f}}</li>
{% endfor %}
</ul>
</section>

<script>
function openFolder(f){ location.href="/browse?path="+f }

function createFolder(){
  if(!cls.value || !sub.value){
    alert("Class and Subject required")
    return
  }
  fetch("/create_folder",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({
      class: cls.value.trim(),
      subject: sub.value.trim()
    })
  })
  .then(r=>r.json())
  .then(d=>{
    folders.innerHTML=""
    d.folders.forEach(f=>{
      let li=document.createElement("li")
      li.innerText="📁 "+f
      li.onclick=()=>openFolder(f)
      folders.appendChild(li)
    })
    alert("Folder created")
    cls.value=sub.value=""
  })
}

function openAnswerKey(){
  location.href="https://theomr.shop/50?filename=answer_key.txt&data=save"
}
</script>

</body>
</html>
