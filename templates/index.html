<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header>OMR Scanner</header>

<section>
<button onclick="location.href='/camera'">📷 Camera Scanner</button>
</section>

<section class="card">
<h3>Create New Folder</h3>
<input id="cls" placeholder="Class" required>
<input id="sub" placeholder="Subject" required>
<button onclick="create()">Create</button>
<p id="msg"></p>
</section>

<section class="card">
<h3>Project Folders</h3>
<ul id="folders">
{% for f in folders %}
<li onclick="openFolder('{{f}}')">📁 {{f}}</li>
{% endfor %}
</ul>
</section>

<script>
function openFolder(f){
  location.href = "/browse?path=" + f
}

function create(){
  const cls = clsInput.value = document.getElementById("cls").value
  const sub = document.getElementById("sub").value

  if(!cls || !sub){
    msg.innerText = "Class & Subject required"
    return
  }

  fetch("/create_folder",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({class:cls,subject:sub})
  })
  .then(r=>r.json())
  .then(d=>{
    const li = document.createElement("li")
    li.innerText = "📁 " + d.folder
    li.onclick = ()=>openFolder(d.folder)
    folders.appendChild(li)
    msg.innerText = "Folder created"
  })
}
</script>

</body>
</html>
