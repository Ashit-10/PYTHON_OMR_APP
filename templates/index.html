<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header>OMR Scanner</header>

<section>
  <button onclick="location.href='/camera'">📷 Camera Scanner</button>
  <button onclick="openCreate()">➕ Create Folder</button>
  <button onclick="openAnswerKey()">🗝 Answer Key</button>
</section>

<section class="card">
<h3>Project Folders</h3>
<ul id="folders">
{% for f in folders %}
<li onclick="openFolder('{{f}}')">📁 {{f}}</li>
{% endfor %}
</ul>
</section>

<!-- CREATE FOLDER MODAL -->
<div id="createModal" class="modal">
  <div class="modal-box">
    <h3>Create Folder</h3>
    <input id="cls" placeholder="Class (required)">
    <input id="sub" placeholder="Subject (required)">
    <button onclick="createFolder()">Create</button>
    <button class="danger" onclick="closeCreate()">Cancel</button>
  </div>
</div>

<script>
function openFolder(f){ location.href="/browse?path="+f }

function openCreate(){ createModal.style.display="flex" }
function closeCreate(){ createModal.style.display="none" }

function createFolder(){
  fetch("/create_folder",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({
      class: cls.value.trim(),
      subject: sub.value.trim()
    })
  })
  .then(r=>r.json())
  .then(d=>{
    folders.innerHTML=""
    d.folders.forEach(f=>{
      let li=document.createElement("li")
      li.innerText="📁 "+f
      li.onclick=()=>openFolder(f)
      folders.appendChild(li)
    })
    closeCreate()
  })
}

function openAnswerKey(){
  location.href="https://theomr.shop/50?filename=answer_key.txt&data=save"
}
</script>

</body>
</html>
