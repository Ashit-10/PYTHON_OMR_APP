<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OMR Dashboard</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header>OMR Scanner</header>

<section class="actions">
  <button onclick="location.href='camera_ui.html'">📷 Scan OMR Sheet</button>
  <button onclick="showModal()">➕ Create Project Folder</button>
  <button onclick="openAnswerKey()">🗝 Answer Key</button>
</section>

<section class="card">
  <h3>Project Folders</h3>
  <div id="folders">
    {% for f in folders %}
      <div class="folder-card" 
           oncontextmenu="showDeleteOption(event,'{{ f }}');return false;" 
           onclick="openFolder('{{ f }}')">
        📁 {{ f }}
        <button class="mini danger delete-folder hidden" onclick="deleteFolder('{{ f }}')">🗑</button>
      </div>
    {% endfor %}
  </div>
</section>

<!-- Modal popup -->
<div id="modal" class="modal hidden">
  <div class="modal-content">
    <h3>Create Project Folder</h3>
    <input id="cls" placeholder="Class">
    <input id="sub" placeholder="Subject">
    <div class="modal-buttons">
      <button onclick="createFolder()">Create</button>
      <button onclick="closeModal()">Cancel</button>
    </div>
  </div>
</div>

<script>
function openFolder(f){ location.href="/browse?path="+f }

function showModal(){ document.getElementById("modal").classList.remove("hidden") }
function closeModal(){ document.getElementById("modal").classList.add("hidden") }

function createFolder(){
  let clsVal = cls.value.trim()
  let subVal = sub.value.trim()
  if(!clsVal || !subVal){
    alert("Class and Subject required")
    return
  }
  fetch("/create_folder",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({class:clsVal, subject:subVal})
  }).then(r=>r.json()).then(d=>{
    const foldersDiv=document.getElementById("folders")
    foldersDiv.innerHTML=""
    d.folders.forEach(f=>{
      const div=document.createElement("div")
      div.className="folder-card"
      div.innerText="📁 "+f
      div.onclick=()=>openFolder(f)
      if(f.startsWith("class")) div.oncontextmenu=(e)=>{showDeleteOption(e,f); return false;}
      foldersDiv.appendChild(div)
    })
    closeModal()
  })
}

function showDeleteOption(e,f){
  e.stopPropagation()
  const btns=document.querySelectorAll(".delete-folder")
  btns.forEach(b=>b.classList.add("hidden"))
  const parent=e.currentTarget
  const btn=parent.querySelector(".delete-folder")
  if(btn) btn.classList.remove("hidden")
}

function deleteFolder(f){
  if(!confirm("Delete folder "+f+"?")) return
  fetch("/delete",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({path:f})
  }).then(()=>location.reload())
}

function openAnswerKey(){
  location.href="https://theomr.shop/50?filename=answer_key.txt&data=save"
}
</script>

</body>
</html>
