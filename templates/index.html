<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header>OMR Scanner</header>

<section>
<button onclick="location.href='/camera'">📷 Camera Scanner</button>
</section>

<section class="card">
<h3>Create New Folder</h3>

<input id="cls" placeholder="Class (required)">
<input id="sub" placeholder="Subject (required)">

<button onclick="createFolder()">Create</button>
<p id="msg"></p>
</section>

<section class="card">
<h3>Project Folders</h3>
<ul id="folders">
{% for f in folders %}
  <li onclick="openFolder('{{ f }}')">📁 {{ f }}</li>
{% endfor %}
</ul>
</section>

<script>
function openFolder(f){
  location.href = "/browse?path=" + f
}

function createFolder(){
  const cls = document.getElementById("cls").value.trim()
  const sub = document.getElementById("sub").value.trim()
  const msg = document.getElementById("msg")

  if(!cls || !sub){
    msg.innerText = "Class and Subject are required"
    return
  }

  fetch("/create_folder",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({ class: cls, subject: sub })
  })
  .then(r => r.json())
  .then(data => {
    msg.innerText = "Folder created"

    const ul = document.getElementById("folders")
    ul.innerHTML = ""

    data.folders.forEach(f => {
      const li = document.createElement("li")
      li.innerText = "📁 " + f
      li.onclick = () => openFolder(f)
      ul.appendChild(li)
    })
  })
}
</script>

</body>
</html>
