<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OMR Dashboard</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header>OMR Scanner</header>

<section class="actions">
  <button onclick="location.href='/scan'">📷 Scan OMR Sheet</button>
  <button onclick="showModal()">➕ Create Project Folder</button>
  <button onclick="openAnswerKey()">🗝 Answer Key</button>
</section>

<section class="card" style="margin: 12px;">
  <h3>Project Folders</h3>
  <div id="folders">
    {# Manually list the folders in your preferred order #}
    {% set ordered_list = ['input', 'output', 'error_images', 'duplicates'] %}
    
    {% for target in ordered_list %}
      {% if target in folders %}
        <div class="folder-card" onclick="openFolder('{{ target }}')">
          📁 {{ target }}
          <button class="mini danger delete-folder" onclick="event.stopPropagation(); deleteFolder('{{ target }}')">🗑</button>
        </div>
      {% endif %}
    {% endfor %}
  </div>
</section>



<div id="modal" class="modal hidden">
  <div class="modal-content">
    <h3>Create Project Folder</h3>
    <input id="clsInput" placeholder="Class (e.g. 10)">
    <input id="subInput" placeholder="Subject (e.g. Math)">
    <div class="modal-buttons">
      <button onclick="createFolder()">Create</button>
      <button onclick="closeModal()">Cancel</button>
    </div>
  </div>
</div>

<script>
const foldersDiv = document.getElementById("folders");

function openFolder(f){ 
    window.location.href = "/browse?path=" + encodeURIComponent(f); 
}

function showModal(){ document.getElementById("modal").classList.remove("hidden") }
function closeModal(){ document.getElementById("modal").classList.add("hidden") }

function createFolder(){
  const clsVal = document.getElementById("clsInput").value.trim();
  const subVal = document.getElementById("subInput").value.trim();
  if(!clsVal || !subVal){ alert("Class and Subject required"); return; }
  
  fetch("/create_folder",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({class:clsVal, subject:subVal})
  })
  .then(r => r.json())
  .then(d => {
    location.reload(); // Simplest way to refresh the folder list properly
  });
}

function openAnswerKey() {
    // This assumes you want to edit the answer key for the "input" folder by default
    // or you can change "input" to whatever folder you are working in.
    window.location.href = "/answer_key?folder=input";
}

function deleteFolder(f){
  if(!confirm("Delete folder "+f+"?")) return
  fetch("/delete",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({path:f})
  }).then(()=>location.reload())
}

// Long press for mobile to show delete button
function attachLongPress(el, folderName){
    let longPressTimer;
    el.addEventListener("touchstart", function(e){
        longPressTimer = setTimeout(()=>{
            const btn = el.querySelector(".delete-folder");
            if(btn) btn.style.display="inline-block";
        }, 600);
    });
    el.addEventListener("touchend", () => clearTimeout(longPressTimer));
    el.addEventListener("touchmove", () => clearTimeout(longPressTimer));
}

document.querySelectorAll(".folder-card").forEach(div => {
    const name = div.innerText.replace("📁 ","").trim();
    attachLongPress(div, name);
});
</script>
</body>
</html>
