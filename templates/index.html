<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OMR Dashboard</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header>OMR Scanner</header>

<section class="actions">
  <button onclick="location.href='camera_ui.html'">📷 Scan OMR Sheet</button>
  <button onclick="showModal()">➕ Create Project Folder</button>
  <button onclick="openAnswerKey()">🗝 Answer Key</button>
</section>

<section class="card">
  <h3>Project Folders</h3>
  <div id="folders">
    {% for f in folders %}
      <div class="folder-card">
        📁 {{ f }}
        <button class="mini danger delete-folder" onclick="deleteFolder('{{ f }}')">🗑</button>
      </div>
    {% endfor %}
  </div>
</section>

<!-- Modal popup -->
<div id="modal" class="modal hidden">
  <div class="modal-content">
    <h3>Create Project Folder</h3>
    <input id="cls" placeholder="Class">
    <input id="sub" placeholder="Subject">
    <div class="modal-buttons">
      <button onclick="createFolder()">Create</button>
      <button onclick="closeModal()">Cancel</button>
    </div>
  </div>
</div>

<script>
const foldersDiv = document.getElementById("folders");

function openFolder(f){ location.href="/browse?path="+f }

function showModal(){ document.getElementById("modal").classList.remove("hidden") }
function closeModal(){ document.getElementById("modal").classList.add("hidden") }

function createFolder(){
  const clsVal = cls.value.trim()
  const subVal = sub.value.trim()
  if(!clsVal || !subVal){ alert("Class and Subject required"); return; }
  fetch("/create_folder",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({class:clsVal, subject:subVal})
  }).then(r=>r.json()).then(d=>{
    foldersDiv.innerHTML=""
    d.folders.forEach(f=>{
      const div = document.createElement("div")
      div.className="folder-card"
      div.innerText="📁 "+f
      div.onclick=()=>openFolder(f)
      const btn = document.createElement("button")
      btn.className="mini danger delete-folder"
      btn.innerText="🗑"
      btn.style.display="none"
      btn.onclick=(e)=>{ e.stopPropagation(); deleteFolder(f); }
      div.appendChild(btn)
      foldersDiv.appendChild(div)
      attachLongPress(div, f)
    })
    closeModal()
  })
}

function openAnswerKey(){ location.href="https://theomr.shop/50?filename=answer_key.txt&data=save" }

function deleteFolder(f){
  if(!confirm("Delete folder "+f+"?")) return
  fetch("/delete",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({path:f})
  }).then(()=>location.reload())
}

/* =====================
   LONG PRESS DETECTION
===================== */
let longPressTimer;
function attachLongPress(el, folderName){
    el.addEventListener("touchstart", function(e){
        if(!folderName.startsWith("class")) return;
        longPressTimer = setTimeout(()=>{
            const btn = el.querySelector(".delete-folder");
            if(btn) btn.style.display="inline-block";
        }, 600); // 600ms long press
    });
    el.addEventListener("touchend", function(e){ clearTimeout(longPressTimer); });
    el.addEventListener("touchmove", function(e){ clearTimeout(longPressTimer); });
}

/* attach long press to existing folders */
foldersDiv.childNodes.forEach(div=>{
    const name = div.innerText.replace("📁 ","");
    attachLongPress(div,name)
});
</script>

</body>
</html>
