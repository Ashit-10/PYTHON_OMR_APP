name: Build APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-22.04  # Use 22.04 specifically to avoid Ubuntu 24 compatibility issues
    steps:
      - uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"

      - name: Install Missing Dependencies
        run: |
          sudo apt update
          # Manually install libtinfo5 which is required by older Android NDKs
          sudo apt install -y libncurses5 libtinfo5

      - name: Build with Buildozer
        uses: digreatbrian/buildozer-action@v2
        with:
          python-version: 3.11
          buildozer-cmd: buildozer android debug
          work-dir: .

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OMR-Scanner-App
          path: bin/*.apk
