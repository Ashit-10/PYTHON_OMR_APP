name: Build APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt update
          # Added multilib and libtool-bin to fix the 'C compiler cannot create executables' error
          sudo apt install -y libncurses5 libtinfo5 cmake libffi-dev build-essential \
          python3-dev sdkmanager autoconf libtool libtool-bin pkg-config zlib1g-dev \
          patchelf gcc-multilib g++-multilib
          pip install --upgrade pip
          # Lock versions to stop the constructor error
          pip install "setuptools<60.0" "Cython==0.29.36" buildozer

      - name: Build with Buildozer
        run: |
          # Keep this - it fixed the first wsgiref error
          mkdir -p wsgiref
          touch wsgiref/__init__.py
          
          buildozer android debug
        env:
          ACCEPT_SDK_LICENSE: "yes"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OMR-Scanner-App
          path: bin/*.apk
