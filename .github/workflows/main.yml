name: Build APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y libncurses5 libtinfo5 cmake libffi-dev build-essential \
          python3-dev sdkmanager autoconf libtool pkg-config zlib1g-dev \
          libncurses5-dev libgdbm-dev libnss3-dev libssl-dev libreadline-dev libsqlite3-dev sqlite3 bzip2 libbz2-dev
          pip install --upgrade pip setuptools cython buildozer

      - name: Build with Buildozer
        run: |
          # The MAGIC step: Create a fake wsgiref folder so pip think it's already there
          mkdir -p wsgiref
          touch wsgiref/__init__.py
          
          # Run the build and skip the broken dependency check
          buildozer android debug
        env:
          ACCEPT_SDK_LICENSE: "yes"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OMR-Scanner-App
          path: bin/*.apk
