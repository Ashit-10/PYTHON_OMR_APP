<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>OMR Sheet Scanner</title>
  <style>
    body, html {
      margin: 0; padding: 0;
      background: black;
      color: white;
      font-family: sans-serif;
      height: 100%;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #wrap {
      position: relative;
      height: 80vh;
      aspect-ratio: 3/8;
      border: 4px solid white;
      flex-shrink: 0;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
    }

    .qr-box {
      border: 2px solid lime;
      width: 30px; height: 30px;
      position: absolute;
    }

    .qr-tl { top: 10px; left: 10px; }
    .qr-tr { top: 10px; right: 10px; }
    .qr-bl { bottom: 10px; left: 10px; }
    .qr-br { bottom: 10px; right: 10px; }

    #toggleContainer {
      position: absolute;
      top: 50px;
      right: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }

    #instantToggle {
      appearance: none;
      width: 40px;
      height: 20px;
      background: #555;
      border-radius: 10px;
      position: relative;
      cursor: pointer;
    }

    #instantToggle::before {
      content: '';
      position: absolute;
      top: 3px;
      left: 3px;
      width: 14px; height: 14px;
      background: white;
      border-radius: 50%;
      transition: 0.2s;
    }

    #instantToggle:checked {
      background: limegreen;
    }

    #instantToggle:checked::before {
      transform: translateX(20px);
    }

    #toggleLabel {
      font-size: 14px;
      color: white;
    }

    .controls {
      margin-top: 10px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    button {
      font-size: 16px;
      padding: 5px 10px;
      border: none;
      border-radius: 5px;
      background: white;
      color: black;
      cursor: pointer;
    }

#toast {
  position: fixed;
  top: 50vh;
  z-index: 9999;
  display: flex; 
  /*flex-direction: row; Text on left, image on right */
  align-items: center;
  pointer-events: none;
  margin-right: 0px;
}

#toast img {
  display: flex;
  max-height: 150px;
  width: auto;
  
  /* Use the top-right corner as the anchor */
  transform-origin: bottom right;
  
  /* Rotate 90deg, then move it down by its own width 
     to bring it back into the viewport */
  transform: rotate(90deg) translateY(52%);
  
  /* Ensures it sits flush against the edge */
  margin: 0; 
  box-shadow: -4px 4px 15px rgba(0,0,0,0.5);
}

.toast-text {
  /* Keep your existing text styling */
  background: rgba(34, 34, 34, 0.95);
  color: #fff;
  padding: 12px 20px;
  border-radius: 20px;
  border: 1px solid #444;
  font-weight: bold;
  white-space: nowrap;
  pointer-events: auto;
  /* If you want the text vertical too, keep the rotate */
  transform: rotate(90deg); 
  margin-bottom: 0px;
}



    #exitBtn {
      position: absolute;
      top: 20px;
      left: 10px;
      z-index: 9999;
    }
    
  


#toast b {
  color: limegreen;
  font-size: 18px;
}

  </style>
</head>
<body>

  <button id="exitBtn">Exit</button>

  <div id="wrap">
    <video id="video" autoplay playsinline muted></video>
    <div class="overlay">
      <div class="qr-box qr-tl"></div>
      <div class="qr-box qr-tr"></div>
      <div class="qr-box qr-bl"></div>
      <div class="qr-box qr-br"></div>
    </div>
  </div>

  <div id="toggleContainer">
    <input type="checkbox" id="instantToggle">
    <div id="toggleLabel">Instant</div>
  </div>

<div class="controls">
    <input type="number" 
           id="rollInput" 
           placeholder="Roll" 
           inputmode="numeric" 
           pattern="[0-9]*" 
           min="1"
           max="99"
           oninput="if(this.value.length > 2) this.value = this.value.slice(0, 2);"
           onkeydown="return ['Backspace','Delete','ArrowLeft','ArrowRight','Tab'].includes(event.code) || /[0-9]/.test(event.key)"
           style="width: 60px; padding: 10px; border-radius: 5px; border: 1px solid white; background: #222; color: white; font-size: 16px;">
    
    <button id="flashBtn">Flash</button>
    <button id="captureBtn">Click</button>
  <button id="refreshBtn">Refresh</button>
    <button id="fileBtn">📁</button>
    <input type="file" id="fileInput" accept="image/*" style="display: none;">
    
</div>

  <div id="toast"></div>

  <script>
    let stream, torchOn = false;
    const video = document.getElementById('video');
    const flashBtn = document.getElementById('flashBtn');
    const captureBtn = document.getElementById('captureBtn');
    const fileBtn = document.getElementById('fileBtn');
    const fileInput = document.getElementById('fileInput');
    const refreshBtn = document.getElementById('refreshBtn');
    const instantToggle = document.getElementById('instantToggle');
    const toast = document.getElementById('toast');

    let permanentToast = false;

    instantToggle.checked = localStorage.getItem('instantMode') === 'true';

    if (!sessionStorage.getItem('initialShown')) {
      alert(`📸 Instant ON:
The processed OMR sheet will appear directly on screen.

📥 Instant OFF:
Just click Capture – it will process in background and show result here.

💡 Recommended: Use Instant OFF for better performance and speed.`);
      sessionStorage.setItem('initialShown', 'true');
    }

    instantToggle.onchange = () => {
      localStorage.setItem('instantMode', instantToggle.checked);
    };

    function showToast(msg, permanent = false, imageUrl = null) {
  permanentToast = permanent;
  toast.innerHTML = ''; 

  if (imageUrl) {
    const img = document.createElement('img');
    img.src = imageUrl;
    toast.appendChild(img);
  }

  const textContainer = document.createElement('div');
  textContainer.className = 'toast-text';
  textContainer.innerHTML = msg;
  toast.appendChild(textContainer);

  // Set to flex to enable the row-reverse layout
  toast.style.display = 'flex';

  if (!permanent) {
    setTimeout(() => {
      if (!permanentToast) toast.style.display = 'none';
    }, 10000);
  }
}





    async function startCamera() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' },
        width: { ideal: 1920 }, // High-res source
        height: { ideal: 1080 }
      }
    });
        video.srcObject = stream;
        video.play();
        
         // --- ADD FOCUS LOGIC HERE ---
    const track = stream.getVideoTracks()[0];
    const capabilities = track.getCapabilities();

    if (capabilities.focusMode && capabilities.focusMode.includes('continuous')) {
      await track.applyConstraints({
        advanced: [{ focusMode: 'continuous' }]
      });
    }
    // ----------------------------

        cameraStartTime = Date.now();
        startAutoCooldownCheck();
      } catch (e) {
        alert('Camera access denied.');
      }
    }

    async function toggleFlash() {
  if (!stream) return;
  try {
    const track = stream.getVideoTracks()[0];
    const capabilities = track.getCapabilities();
    if (!capabilities.torch) {
      alert('❌ Flash not supported.');
      return;
    }

    // Toggle state
    torchOn = !torchOn;

    await track.applyConstraints({
      advanced: [{ torch: torchOn }]
    });

    flashBtn.textContent = torchOn ? 'Flash Off' : '🔦 Flash';
  } catch (err) {
    console.error('Flash toggle failed:', err);
    alert('⚠️ Flash control failed.');
    torchOn = false;
    flashBtn.textContent = '🔦 Flash';
  }
}

    function extractCorrect(filename) {
      const parts = filename.split("_");
      return parts[1];
    }

    // Logic for processing (Shared between Capture and File Upload)
    async function processImage(blob, previewUrl) {
        const isInstant = instantToggle.checked;
        const rollNum = document.getElementById('rollInput').value;

        if (isInstant && stream) {
            stream.getTracks().forEach(t => t.stop());
        }

        const formData = new FormData();
        formData.append('image', blob, 'capture.jpg');
        formData.append('roll', rollNum);

        let loadingScreen = null;
        if (isInstant) {
            loadingScreen = document.createElement('div');
            loadingScreen.style = "position:fixed;top:0;left:0;width:100%;height:100%;background:black;z-index:10000;display:flex;flex-direction:column;align-items:center;justify-content:center;color:white;padding:20px;box-sizing:border-box;";
            loadingScreen.innerHTML = `
                 <img id="procImg" src="${previewUrl}" style="max-width:90%; max-height:60%; object-fit:contain; transform: rotate(-90deg); margin-bottom:40px; border:1px solid #444;">
                <h3 id="procStatus" style="margin:10px 0;">Processing...</h3>
                <p id="statusMsg" style="margin:5px 0;">Uploading to Server...</p>`;
            document.body.appendChild(loadingScreen);
        } else {
            showToast("Uploading & Analyzing...", false);
        }

        try {
            const response = await fetch(`${window.location.origin}/upload`, {
                method: 'POST',
                body: formData,
                mode: 'cors'
            });

            if (!response.ok) throw new Error("Upload Failed");

            if (isInstant) document.getElementById('statusMsg').textContent = "Analyzing OMR...";

            let attempts = 0;
            const checkStatus = setInterval(async () => {
                attempts++;
                try {
                    const st = await fetch(`${window.location.origin}/status`);
                    const data = await st.json();

                    if (!data.processing) {
                        clearInterval(checkStatus);
                        if (data.filename) {
                            if (isInstant) {
                                const imgEl = document.getElementById('procImg');
                                imgEl.style.transform = "rotate(0deg)"; 
                                imgEl.style.width = "100vw";
                                imgEl.style.height = "auto";
                                imgEl.style.maxWidth = "100vw";
                                imgEl.style.objectFit = "cover";
                                imgEl.style.display = "block";
                                imgEl.style.margin = "0";
                                imgEl.src = `/temp_output/${data.filename}?t=${Date.now()}`;

                                document.getElementById('procStatus').textContent = "Analysis Complete";
                                document.getElementById('statusMsg').innerHTML = `<b style="font-size:24px; color:limegreen;">Correct: ${extractCorrect(data.filename)}</b>`;

                                const btn = document.createElement('button');
                                btn.textContent = "Scan Next";
                                btn.style = "margin-top:20px; padding:15px 40px; font-size:18px; background:white; color:black; border-radius:8px; border:none; font-weight:bold;";
                                btn.onclick = () => location.reload();
                                loadingScreen.appendChild(btn);
                                imgEl.parentElement.style.padding = "0";
                                imgEl.parentElement.style.margin = "0";
                            } else {
            // NEW IMAGE TOAST LOGI
            // NEW IMAGE TOAST LOGIC - Fixed for Accuracy
const resultUrl = `${window.location.origin}/temp_output/${data.filename}?nocache=${Date.now()}`;

          //  const resultUrl = `/temp_output/${data.filename}?t=${Date.now()}`;
            const scoreText = `<b>Correct: ${extractCorrect(data.filename)}</b>`;
            
            showToast(scoreText, false, resultUrl);
      

                            }
                        } else {
                            throw new Error("No filename returned");
                        }
                    }
                    if (attempts > 30) throw new Error("Timeout: Server took too long");
                } catch (e) {
                    clearInterval(checkStatus);
                    if (isInstant) handleProcError(loadingScreen, checkStatus, e.message);
                    else showToast("Error processing result.");
                }
            }, 700);

        } catch (err) {
            if (isInstant) handleProcError(loadingScreen, null, err.message);
            else showToast("Upload Failed.");
        }
    }

    captureBtn.onclick = async () => {
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0);
        const previewDataUrl = canvas.toDataURL('image/jpeg', 0.5);
        canvas.toBlob((blob) => {
            if (blob) processImage(blob, previewDataUrl);
            else alert("Capture failed");
        }, 'image/jpeg', 0.5);
    };

    // File Upload Handlers
    fileBtn.onclick = () => fileInput.click();
    fileInput.onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
            processImage(file, event.target.result);
        };
        reader.readAsDataURL(file);
    };

function handleProcError(overlay, interval, msg) {
    if (interval) clearInterval(interval);
    const statusEl = document.getElementById('procStatus');
    const detailEl = document.getElementById('statusMsg');
    
    if (statusEl) statusEl.innerHTML = `<span style="color:#ff4444">Error Occurred</span>`;
    if (detailEl) detailEl.textContent = msg;

    if (!document.getElementById('retryBtn')) {
        const rb = document.createElement('button');
        rb.id = "retryBtn";
        rb.textContent = "Try Again";
        rb.style = "margin-top:20px; padding:12px 25px; background:#ff4444; color:white; border-radius:5px; border:none; font-weight:bold;";
        rb.onclick = () => location.reload();
        overlay.appendChild(rb);
    }
}


    refreshBtn.onclick = () => location.reload();
    flashBtn.onclick = toggleFlash;

    document.getElementById('exitBtn').onclick = function () {
      if (stream) {
        stream.getTracks().forEach(track => {
          track.stop();
        });
      }
      video.srcObject = null;
      window.location.href = '/'; 
    };

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        stopCamera();
      } else {
        startCamera();
      }
    });

    function stopCamera() {
      if (stream) {
        stream.getTracks().forEach(t => t.stop());
        stream = null;
        if (torchOn) {
          torchOn = false;
          flashBtn.textContent = '🔦 Flash';
        }
      }
    }

    let cameraStartTime = Date.now();
    function startAutoCooldownCheck() {
      setInterval(() => {
        if (stream && Date.now() - cameraStartTime > 240000) {
          showCooldownWarning();
          stopCamera();
          let i = 10;
          const countdown = setInterval(() => {
            showToast(`🛑 Cooling camera: ${i--}s`);
            if (i < 0) {
              clearInterval(countdown);
              startCamera();
            }
          }, 1000);
        }
      }, 30000);
    }

    function showCooldownWarning() {
      toast.textContent = '🛑 Taking rest for 10 seconds for cooling down camera';
      toast.style.display = 'block';
    }

    startCamera();
  </script>
</body>
</html>
